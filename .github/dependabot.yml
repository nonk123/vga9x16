version: 2

multi-ecosystem-groups:
  sybau:
    schedule:
      interval: monthly

updates:
  - package-ecosystem: docker
    directory: /
    multi-ecosystem-group: sybau
    patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: sybau
    patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    multi-ecosystem-group: sybau
    patterns: ["*"]
